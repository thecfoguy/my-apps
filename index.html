<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#061426">

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="My Apps"
  >

  <title>My Apps</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #02070d;
      color: white;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app-shell {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 15% 12%,
          rgba(0, 119, 255, 0.35),
          transparent 22%
        ),
        radial-gradient(
          circle at 85% 86%,
          rgba(0, 99, 255, 0.18),
          transparent 28%
        ),
        linear-gradient(
          160deg,
          #061426 0%,
          #02070d 48%,
          #000000 100%
        );
    }

    .dots {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.7;

      background-image:
        radial-gradient(
          circle,
          rgba(0, 126, 255, 0.8) 1.3px,
          transparent 1.7px
        );

      background-size: 14px 14px;

      mask-image:
        linear-gradient(
          90deg,
          black 0%,
          transparent 42%,
          transparent 100%
        );

      -webkit-mask-image:
        linear-gradient(
          90deg,
          black 0%,
          transparent 42%,
          transparent 100%
        );
    }

    .glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(0, 102, 255, 0.15);
      filter: blur(70px);
      top: 60px;
      left: -100px;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(92%, 520px);
      margin: 0 auto;
      padding:
        calc(42px + env(safe-area-inset-top))
        0
        calc(40px + env(safe-area-inset-bottom));
    }

    .header {
      margin-bottom: 34px;
    }

    .title {
      margin: 0;
      font-size: clamp(38px, 10vw, 52px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1.8px;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #b7c0cd;
      font-size: 16px;
      letter-spacing: 0.1px;
    }

    .apps {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .app-card {
      position: relative;
      display: grid;
      grid-template-columns: 74px 1fr 34px;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 112px;
      padding: 16px 17px;
      border-radius: 24px;
      overflow: hidden;
      transform: translateZ(0);
      transition:
        transform 0.12s ease,
        filter 0.12s ease;
    }

    .app-card:active {
      transform: scale(0.975);
      filter: brightness(1.15);
    }

    .app-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(
          110deg,
          rgba(255,255,255,0.13),
          rgba(255,255,255,0.015) 40%,
          rgba(255,255,255,0.05)
        );
    }

    .app-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 23px;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,0.04),
          transparent 60%
        );
    }

    .alo-card {
      border: 1.5px solid #ff453a;
      background:
        radial-gradient(
          circle at 12% 50%,
          rgba(255, 45, 45, 0.38),
          transparent 35%
        ),
        linear-gradient(
          100deg,
          rgba(81, 8, 13, 0.9),
          rgba(25, 5, 8, 0.96)
        );

      box-shadow:
        0 0 14px rgba(255, 44, 44, 0.32),
        inset 0 0 18px rgba(255, 59, 48, 0.08);
    }

    .du-card {
      border: 1.5px solid #ffb000;
      background:
        radial-gradient(
          circle at 12% 50%,
          rgba(255, 173, 0, 0.38),
          transparent 35%
        ),
        linear-gradient(
          100deg,
          rgba(77, 48, 0, 0.92),
          rgba(25, 17, 1, 0.96)
        );

      box-shadow:
        0 0 14px rgba(255, 174, 0, 0.3),
        inset 0 0 18px rgba(255, 174, 0, 0.08);
    }

    .notable-card {
      border: 1.5px solid #00e982;
      background:
        radial-gradient(
          circle at 12% 50%,
          rgba(0, 225, 126, 0.34),
          transparent 35%
        ),
        linear-gradient(
          100deg,
          rgba(0, 70, 45, 0.92),
          rgba(1, 25, 17, 0.96)
        );

      box-shadow:
        0 0 14px rgba(0, 236, 132, 0.28),
        inset 0 0 18px rgba(0, 236, 132, 0.08);
    }

    .icon-wrap {
      position: relative;
      z-index: 2;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .alo-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border: 5px solid #ff2d2d;
      box-shadow:
        0 0 18px rgba(255, 45, 45, 0.65);
    }

    .alo-icon span {
      color: #ed1c24;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .du-icon {
      width: 66px;
      height: 66px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffab18;
      box-shadow:
        0 0 18px rgba(255, 171, 24, 0.6);
    }

    .checkbox {
      position: relative;
      width: 42px;
      height: 42px;
      border: 5px solid white;
      border-radius: 7px;
    }

    .checkbox::after {
      content: "";
      position: absolute;
      width: 21px;
      height: 11px;
      left: 7px;
      top: 7px;
      border-left: 5px solid white;
      border-bottom: 5px solid white;
      transform: rotate(-45deg);
    }

    .notable-icon {
      width: 66px;
      height: 66px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08d878;
      box-shadow:
        0 0 18px rgba(0, 230, 126, 0.55);
    }

    .notable-icon span {
      color: white;
      font-size: 43px;
      line-height: 1;
      font-weight: 900;
    }

    .app-info {
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    .app-name {
      margin: 0 0 5px;
      font-size: 24px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .app-description {
      margin: 0;
      color: #d3d5d8;
      font-size: 14px;
      line-height: 1.25;
    }

    .arrow {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: 200
