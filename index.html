<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#061426">

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="My Apps"
  >

  <title>My Apps</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #02070d;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: #02070d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 5% 15%,
          rgba(0, 105, 255, 0.30),
          transparent 26%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(0, 100, 255, 0.14),
          transparent 28%
        ),
        linear-gradient(
          160deg,
          #07192e 0%,
          #020a13 48%,
          #000000 100%
        );
    }

    .dot-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 135px;
      height: 100%;
      opacity: 0.60;
      pointer-events: none;

      background-image:
        radial-gradient(
          circle,
          #087dff 1.5px,
          transparent 2px
        );

      background-size: 14px 14px;
    }

    .fade {
      position: absolute;
      top: 0;
      left: 70px;
      width: 170px;
      height: 100%;
      pointer-events: none;

      background:
        linear-gradient(
          to right,
          rgba(2, 7, 13, 0),
          rgba(2, 7, 13, 1)
        );
    }

    .container {
      position: relative;
      z-index: 5;
      width: 90%;
      max-width: 520px;
      margin: 0 auto;

      padding-top:
        calc(48px + env(safe-area-inset-top));

      padding-bottom:
        calc(40px + env(safe-area-inset-bottom));
    }

    .header {
      margin-bottom: 34px;
    }

    .title {
      margin: 0;

      font-size: 44px;
      line-height: 1;

      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 10px 0 0;

      color: #c2c8d0;

      font-size: 16px;
      line-height: 1.3;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;
      min-height: 112px;

      padding: 16px;

      border-radius: 24px;

      overflow: hidden;

      transition:
        transform 0.12s ease,
        filter 0.12s ease;
    }

    .card:active {
      transform: scale(0.975);
      filter: brightness(1.15);
    }

    .alo-card {
      border: 2px solid #ff4238;

      background:
        linear-gradient(
          100deg,
          #5d0c11 0%,
          #260609 48%,
          #110305 100%
        );

      box-shadow:
        0 0 18px rgba(255, 55, 45, 0.30);
    }

    .du-card {
      border: 2px solid #ffb000;

      background:
        linear-gradient(
          100deg,
          #594000 0%,
          #2c1d00 48%,
          #120c00 100%
        );

      box-shadow:
        0 0 18px rgba(255, 174, 0, 0.28);
    }

    .notable-card {
      border: 2px solid #00e986;

      background:
        linear-gradient(
          100deg,
          #005a38 0%,
          #00301f 48%,
          #00170f 100%
        );

      box-shadow:
        0 0 18px rgba(0, 232, 130, 0.25);
    }

    .icon-area {
      width: 76px;
      min-width: 76px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .alo-icon {
      width: 68px;
      height: 68px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      border: 5px solid #ff3030;

      box-shadow:
        0 0 18px rgba(255, 48, 48, 0.55);
    }

    .alo-icon-text {
      color: #ed1c24;

      font-size: 25px;
      font-weight: 800;

      letter-spacing: -1.5px;
    }

    .du-icon {
      width: 66px;
      height: 66px;

      border-radius: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffad18;

      box-shadow:
        0 0 18px rgba(255, 173, 24, 0.50);
    }

    .check-box {
      position: relative;

      width: 42px;
      height: 42px;

      border: 5px solid #ffffff;

      border-radius: 7px;
    }

    .check-box::after {
      content: "";

      position: absolute;

      width: 21px;
      height: 11px;

      left: 7px;
      top: 7px;

      border-left: 5px solid #ffffff;
      border-bottom: 5px solid #ffffff;

      transform: rotate(-45deg);
    }

    .notable-icon {
      width: 66px;
      height: 66px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #08d878;

      box-shadow:
        0 0 18px rgba(0, 225, 125, 0.50);
    }

    .notable-icon-text {
      color: #ffffff;

      font-size: 43px;
      line-height: 1;

      font-weight: 900;
    }

    .info {
      flex: 1;

      min-width: 0;

      padding-left: 8px;
    }

    .name {
      margin: 0 0 6px;

      color: #ffffff;

      font-size: 24px;
      line-height: 1;

      font-weight: 800;
    }

    .description {
      margin: 0;

      color: #d5d8dc;

      font-size: 14px;
      line-height: 1.25;
    }

    .arrow {
      width: 34px;
      min-width: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-size: 39px;
      line-height: 1;

      font-weight: 300;
    }

    .footer {
      margin-top: 34px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding-left: 9px;
      padding-right: 8px;
    }

    .slogan {
      margin: 0;

      color: #5cb7ff;

      font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size: 27px;
      font-style: italic;

      transform: rotate(-4deg);

      text-shadow:
        0 0 9px rgba(0, 139, 255, 0.45);
    }

    .blue-line {
      width: 100px;
      height: 3px;

      margin-top: 3px;
      margin-left: 30px;

      border-radius: 10px;

      background: #008cff;

      transform: rotate(-6deg);

      box-shadow:
        0 0 6px rgba(0, 140, 255, 0.70);
    }

    .share {
      position: relative;

      width: 56px;
      height: 56px;

      min-width: 56px;

      border-radius: 50%;

      border: 1px solid #75808d;

      background: rgba(0, 0, 0, 0.45);
    }

    .share .dot {
      position: absolute;

      width: 9px;
      height: 9px;

      border: 3px solid #ffffff;

      border-radius: 50%;

      background: #07101b;
    }

    .share .dot1 {
      top: 10px;
      right: 10px;
    }

    .share .dot2 {
      top: 23px;
      left: 10px;
    }

    .share .dot3 {
      bottom: 9px;
      right: 10px;
    }

    .share .line {
      position: absolute;

      width: 20px;
      height: 3px;

      left: 18px;

      border-radius: 5px;

      background: #ffffff;

      transform-origin: left center;
    }

    .share .line1 {
      top: 25px;
      transform: rotate(-31deg);
    }

    .share .line2 {
      top: 30px;
      transform: rotate(31deg);
    }

    @media (max-width: 390px) {

      .container {
        width: 92%;
      }

      .title {
        font-size: 40px;
      }

      .card {
        min-height: 105px;
        padding: 14px;
      }

      .icon-area {
        width: 68px;
        min-width: 68px;
      }

      .alo-icon {
        width: 61px;
        height: 61px;
      }

      .du-icon,
      .notable-icon {
        width: 60px;
        height: 60px;
      }

      .name {
        font-size: 22px;
      }

      .description {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="screen">

    <div class="dot-field"></div>

    <div class="fade"></div>

    <div class="container">

      <header class="header">

        <h1 class="title">
          My Apps
        </h1>

        <p class="subtitle">
          Three tools. One place.
        </p>

      </header>


      <div class="cards">

        <a
          class="card alo-card"
          href="https://thecfoguy.github.io/Alo-New/"
        >

          <div class="icon-area">

            <div class="alo-icon">

              <span class="alo-icon-text">
                Alo
              </span>

            </div>

          </div>

          <div class="info">

            <h2 class="name">
              Alo
            </h2>

            <p class="description">
              Translate words<br>
              into other languages
            </p>

          </div>

          <div class="arrow">
            ›
          </div>

        </a>


        <a
          class="card du-card"
          href="https://thecfoguy.github.io/2DU/"
        >

          <div class="icon-area">

            <div class="du-icon">

              <div class="check-box"></div>

            </div>

          </div>

          <div class="info">

            <h2 class="name">
              2DU
            </h2>

            <p class="description">
              Your to-do list,<br>
              made simple
            </p>

          </div>

          <div class="arrow">
            ›
          </div>

        </a>


        <a
          class="card notable-card"
          href="https://thecfoguy.github.io/Notable-App/"
        >

          <div class="icon-area">

            <div class="notable-icon">

              <span class="notable-icon-text">
                N
              </span>

            </div>

          </div>

          <div class="info">

            <h2 class="name">
              Notable
            </h2>

            <p class="description">
              Notes, ideas,<br>
              and reminders
            </p>

          </div>

          <div class="arrow">
            ›
          </div>

        </a>

      </div>


      <div class="footer">

        <div>

          <p class="slogan">
            Get more done today.
          </p>

          <div class="blue-line"></div>

        </div>

        <div class="share">

          <span class="dot dot1"></span>

          <span class="dot dot2"></span>

          <span class="dot dot3"></span>

          <span class="line line1"></span>

          <span class="line line2"></span>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
